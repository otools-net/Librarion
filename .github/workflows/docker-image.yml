# The Docker image of Librarion on ghcr.io (docs/docker.md, agents/docs/environment/docker.md), as SFE's:
# - a push to edge publishes ghcr.io/otools-net/librarion:edge (the work not released yet: a test server follows it);
# - a push to main publishes :main;
# - a version tag (v0.9.0) publishes :0.9.0, :0.9 and :latest (a pre-release only its own tag);
# - "Run workflow" (Actions tab) builds the branch chosen and publishes it under the tag typed there, if any.
# The tests run first (Linux, SQLite, and the client's specs; build-test.yml runs the rest); nothing is published
# when they fail.
name: Docker image

on:
  push:
    branches: [edge, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish under this image tag too (e.g. "test"); empty = only what the branch gets'
        required: false
        default: ''

# A newer push to a branch replaces a run still going; releases always finish.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

env:
  IMAGE: ghcr.io/otools-net/librarion
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NG_CLI_ANALYTICS: 'false'
  LIBRARION_TEST_TIME_FACTOR: '3'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: The tag is the version of Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '[:space:]')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Directory.Build.props says $version: tag the commit that bumps the version."
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Librarion.Web/package-lock.json

      - name: Client specs
        working-directory: src/Librarion.Web
        run: |
          npm ci --no-audit --no-fund
          npm test

      # The Api build builds the client into wwwroot, which the privacy tests read.
      - name: Server tests
        run: dotnet test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Both platforms from one build: the build stages run on the runner's platform and the last one runs nothing.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest only for a release (semver tag without a pre-release part).
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Librarion
            org.opencontainers.image.description=Self-hosted e-book library server for huge libraries, with OPDS and an e-reader mode
          annotations: |
            org.opencontainers.image.description=Self-hosted e-book library server for huge libraries, with OPDS and an e-reader mode
        env:
          # The description shows on the package's page for a multi-platform image too.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A manual run without a tag only builds.
          push: ${{ steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            LIBRARION_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
